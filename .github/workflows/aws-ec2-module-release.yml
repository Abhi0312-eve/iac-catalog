name: AWS EC2 Module Release

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/aws-ec2-module-release.yml'
      - 'templates/aws-ec2/skeleton/**'
      - 'templates/aws-ec2/VERSION'

permissions:
  contents: write

concurrency:
  group: aws-ec2-module-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch existing release tags
        run: |
          git fetch origin --tags

      - name: Reconcile latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG="$(
            git tag --list 'aws-ec2-v*' |
            grep -E '^aws-ec2-v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1
          )"

          if [[ -z "$LATEST_TAG" ]]; then
            echo "No existing AWS EC2 module release tag found."
            exit 1
          fi

          echo "Latest existing module tag: $LATEST_TAG"

          HTTP_STATUS="$(
            curl -sS \
              -o /tmp/release-response.json \
              -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${LATEST_TAG}"
          )"

          case "$HTTP_STATUS" in
            200)
              DRAFT="$(jq -r '.draft' /tmp/release-response.json)"
              PRERELEASE="$(jq -r '.prerelease' /tmp/release-response.json)"

              if [[ "$DRAFT" == "false" && "$PRERELEASE" == "false" ]]; then
                echo "Published GitHub Release already exists."
              else
                echo "ERROR: Existing release is a draft or prerelease."
                exit 1
              fi
              ;;
            404)
              echo "Release missing. Publishing against existing tag."

              gh release create "$LATEST_TAG" \
                --verify-tag \
                --title "AWS EC2 Module ${LATEST_TAG#aws-ec2-}" \
                --generate-notes
              ;;
            *)
              echo "ERROR: GitHub API returned HTTP ${HTTP_STATUS}."
              cat /tmp/release-response.json
              exit 1
              ;;
          esac

      - name: Determine version bump
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "Commit: $COMMIT_MSG"

          CURRENT_TAG="$(
            git tag --list 'aws-ec2-v*' |
            grep -E '^aws-ec2-v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1
          )"

          if [[ -z "$CURRENT_TAG" ]]; then
            echo "ERROR: No existing module version tag found."
            exit 1
          fi

          CURRENT="${CURRENT_TAG#aws-ec2-v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [[ "$COMMIT_MSG" =~ BREAKING\ CHANGE|!: ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "$COMMIT_MSG" =~ ^feat(\(.+\))?: ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [[ "$COMMIT_MSG" =~ ^fix(\(.+\))?: ]]; then
            PATCH=$((PATCH + 1))
          else
            echo "No version-triggering commit type found."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="aws-ec2-v${NEW_VERSION}"

          echo "Current version: $CURRENT"
          echo "Proposed version: $NEW_VERSION"

          if git show-ref --verify --quiet "refs/tags/${NEW_TAG}"; then
            echo "ERROR: Tag ${NEW_TAG} already exists locally after fetching remote tags."
            echo "Refusing to overwrite an existing release."
            exit 1
          fi

          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Update VERSION and CHANGELOG
        if: steps.bump.outputs.release == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "$NEW_VERSION" > templates/aws-ec2/VERSION

          DATE=$(date -u +%Y-%m-%d)

          {
            echo "## ${NEW_VERSION} - ${DATE}"
            echo
            echo "### Changes"
            echo
            printf '%s\n' "- ${COMMIT_MSG}"
            echo
            cat templates/aws-ec2/CHANGELOG.md
          } > /tmp/CHANGELOG.md

          mv /tmp/CHANGELOG.md templates/aws-ec2/CHANGELOG.md

      - name: Create release commit and tag
        if: steps.bump.outputs.release == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new }}
          NEW_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git add \
            templates/aws-ec2/VERSION \
            templates/aws-ec2/CHANGELOG.md

          git commit -m "chore: release aws-ec2 v${NEW_VERSION}"

          git tag -a "$NEW_TAG" \
            -m "Release AWS EC2 module ${NEW_VERSION}"

          git push --atomic origin \
            HEAD:refs/heads/master \
            "refs/tags/${NEW_TAG}"

      - name: Publish GitHub Release
        if: steps.bump.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.bump.outputs.tag }}
          NEW_VERSION: ${{ steps.bump.outputs.new }}
        run: |
          gh release create "$NEW_TAG" \
            --verify-tag \
            --title "AWS EC2 Module v${NEW_VERSION}" \
            --generate-notes
