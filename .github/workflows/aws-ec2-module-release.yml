name: AWS EC2 Module Release

on:
  push:
    branches:
      - main
    paths:
      - 'templates/aws-ec2/skeleton/**'
      - 'templates/aws-ec2/VERSION'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read current version
        id: version
        run: |
          VERSION=$(cat templates/aws-ec2/VERSION)
          echo "current=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Determine version bump
        id: bump
        run: |
          CURRENT="${{ steps.version.outputs.current }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          COMMIT_MSG="${{ github.event.head_commit.message }}"

          echo "Commit: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -qE 'BREAKING CHANGE|!:'; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMIT_MSG" | grep -qE '^feat(\(.+\))?:'; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif echo "$COMMIT_MSG" | grep -qE '^fix(\(.+\))?:'; then
            PATCH=$((PATCH + 1))
          else
            echo "No version-triggering commit type found."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

          echo "New version: $NEW_VERSION"

      - name: Update VERSION
        if: steps.bump.outputs.release == 'true'
        run: |
          echo "${{ steps.bump.outputs.new }}" > templates/aws-ec2/VERSION

      - name: Update CHANGELOG
        if: steps.bump.outputs.release == 'true'
        run: |
          VERSION="${{ steps.bump.outputs.new }}"
          DATE=$(date -u +%Y-%m-%d)
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          {
            echo "## ${VERSION} - ${DATE}"
            echo
            echo "### Changes"
            echo
            echo "- ${COMMIT_MSG}"
            echo
            cat templates/aws-ec2/CHANGELOG.md
          } > /tmp/CHANGELOG.md

          mv /tmp/CHANGELOG.md templates/aws-ec2/CHANGELOG.md

      - name: Commit version and changelog
        if: steps.bump.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add templates/aws-ec2/VERSION templates/aws-ec2/CHANGELOG.md

          git commit -m "chore: release aws-ec2 v${{ steps.bump.outputs.new }}"
          git push

      - name: Create Git tag
        if: steps.bump.outputs.release == 'true'
        run: |
          git tag "aws-ec2-v${{ steps.bump.outputs.new }}"
          git push origin "aws-ec2-v${{ steps.bump.outputs.new }}"

      - name: Create GitHub Release
        if: steps.bump.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "aws-ec2-v${{ steps.bump.outputs.new }}" \
            --title "AWS EC2 Module v${{ steps.bump.outputs.new }}" \
            --generate-notes
