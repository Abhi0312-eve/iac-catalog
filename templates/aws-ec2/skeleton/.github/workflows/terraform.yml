name: Provision AWS EC2

on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Show GitHub Context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
         role-to-assume: arn:aws:iam::982344023689:role/GitHubActionsTerraform
         aws-region: ${{ values.region }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      #- name: Terraform Apply
      #  run: terraform apply -auto-approve

      - name: Save EC2 Details
        run: |
          cat > ec2-details.json <<EOF
          {
            "instance_id": "$(terraform output -raw instance_id)",
            "region": "$(terraform output -raw region)",
            "public_ip": "$(terraform output -raw public_ip)",
            "private_ip": "$(terraform output -raw private_ip)"
          }
          EOF
          cat ec2-details.json
      - name: Show EC2 Details
        run: |
          echo "================================"
          echo "EC2 Provisioning Successful"
          echo "================================"
          echo "Instance ID : $(terraform output -raw instance_id)"
          echo "Region      : $(terraform output -raw region)"
          echo "Public IP   : $(terraform output -raw public_ip)"
          echo "Private IP  : $(terraform output -raw private_ip)"
          echo "================================"
