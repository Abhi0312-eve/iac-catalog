name: Provision AWS EC2

on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ '${{ secrets.AWS_ACCESS_KEY_ID }}' }}
          aws-secret-access-key: ${{ '${{ secrets.AWS_SECRET_ACCESS_KEY }}' }}
          aws-session-token: ${{ '${{ secrets.AWS_SESSION_TOKEN }}' }}
          aws-region: ${{ values.region }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Show EC2 Details
        run: |
          echo "================================"
          echo "EC2 Provisioning Successful"
          echo "================================"
          echo "Instance ID : $(terraform output -raw instance_id)"
          echo "Region      : $(terraform output -raw region)"
          echo "Public IP   : $(terraform output -raw public_ip)"
          echo "Private IP  : $(terraform output -raw private_ip)"
          echo "================================"
